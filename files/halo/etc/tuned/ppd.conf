[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
# Keep the standard desktop Performance mode separate from the dedicated
# gpu-sustained / cpu-sustained controls.
performance=throughput-performance

[battery]
# PPD = TuneD
balanced=balanced-battery
